<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case process</title>
<style>
:root{
  --ink:#0F1B2D; --muted:#5B6472; --line:#E3E7ED; --bg:#F6F8FB;
  --brand:#0F6CBD; --red:#F4364C; --green:#107C41; --amber:#C19C00; --grey:#B4BAC4;
}
*{box-sizing:border-box}
body{
  margin:0;padding:12px;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-size:12.5px;color:var(--ink);background:#fff;
}
.hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.hd h3{margin:0;font-size:13px;font-weight:600;letter-spacing:-.1px}
.hd .pill{
  font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  background:#EAF2FB;color:var(--brand);border-radius:20px;padding:2px 8px;white-space:nowrap;
}
.sub{color:var(--muted);font-size:11px;margin:2px 0 12px;line-height:1.45}

/* ---------- stage rail ---------- */
.stages{display:flex;align-items:flex-start;margin:0 0 4px;padding:0 2px}
.stg{flex:1;text-align:center;position:relative;min-width:0}
.stg .bar{height:5px;border-radius:3px;background:var(--line);margin:0 2px 6px}
.stg.done .bar{background:var(--green)}
.stg.now  .bar{background:var(--brand)}
.stg .nm{
  font-size:10.5px;color:var(--muted);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.stg.now .nm{color:var(--brand);font-weight:700}
.stg.done .nm{color:var(--ink)}
.legend{display:flex;gap:10px;font-size:10px;color:var(--muted);margin:8px 0 14px}
.legend b{font-weight:600;color:var(--ink)}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl:before{
  content:"";position:absolute;left:9px;top:8px;bottom:10px;width:2px;background:var(--line);
}
.ti{position:relative;padding:0 0 14px}
.ti .dot{
  position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2.5px solid var(--grey);
}
.ti.done .dot{background:var(--green);border-color:var(--green)}
.ti.done .dot:after{
  content:"";position:absolute;left:3px;top:.5px;width:3px;height:7px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg);
}
.ti.now .dot{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,108,189,.16)}
.ti.late .dot{border-color:var(--red);box-shadow:0 0 0 3px rgba(244,54,76,.14)}
.ti .nm{font-weight:600;line-height:1.35}
.ti.done .nm{color:var(--muted);font-weight:500}
.ti .meta{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.ti .meta .sep{opacity:.45;margin:0 5px}
.chip{
  display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.3px;
  border-radius:4px;padding:1px 6px;margin-right:5px;vertical-align:1px;
}
.chip.now{background:#EAF2FB;color:var(--brand)}
.chip.late{background:#FDECEE;color:var(--red)}
.chip.warn{background:#FBF4DF;color:#8A6D00}
.chip.ok{background:#E9F5EE;color:var(--green)}
.outc{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--green);
  font-weight:600;margin-top:3px;
}
.outc:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
a.open{color:var(--brand);text-decoration:none;font-size:10.5px;font-weight:600}
a.open:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:11.5px;padding:14px 0;line-height:1.5}
.err{color:var(--red);font-size:11.5px;padding:10px 0}
.skl{height:9px;border-radius:5px;background:var(--bg);margin:9px 0}
</style>
</head>
<body>
<div id="root"><div class="skl" style="width:60%"></div><div class="skl"></div><div class="skl" style="width:80%"></div></div>

<script>
"use strict";
var P = "cpc_";

function xrm(){
  var w = window;
  for (var i = 0; i < 6 && w; i++){
    if (w.Xrm && w.Xrm.WebApi) return w.Xrm;
    if (w === w.parent) break;
    w = w.parent;
  }
  return null;
}
function clientUrl(){
  var x = xrm();
  if (x && x.Utility && x.Utility.getGlobalContext){
    try { return x.Utility.getGlobalContext().getClientUrl(); } catch(e){}
  }
  return "";
}
function apiRoot(){ return clientUrl() + "/api/data/v9.2/"; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function caseId(){
  var x = xrm();
  try {
    if (x && x.Page && x.Page.data && x.Page.data.entity){
      var id = x.Page.data.entity.getId();
      if (id) return id.replace(/[{}]/g, "");
    }
  } catch(e){}
  var sp = new URLSearchParams(location.search);
  var d = sp.get("id") || sp.get("recordId");
  if (!d && sp.get("data")){
    try { d = new URLSearchParams(decodeURIComponent(sp.get("data"))).get("id"); } catch(e){}
  }
  return d ? d.replace(/[{}]/g, "") : null;
}

var root = document.getElementById("root");

function fmtDue(iso){
  if (!iso) return null;
  var d = new Date(iso), now = new Date();
  var mins = Math.round((d - now) / 60000);
  var abs = Math.abs(mins);
  var span = abs < 60 ? abs + "m"
           : abs < 2880 ? Math.round(abs / 60) + "h"
           : Math.round(abs / 1440) + "d";
  return { late: mins < 0, text: mins < 0 ? span + " overdue" : "due in " + span,
           stamp: d.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) };
}

function stageRail(bpf){
  if (!bpf || !bpf.stages || !bpf.stages.length) return "";
  var cur = bpf.stages.map(function(s){ return s.name; }).indexOf(bpf.currentStage);
  var cells = bpf.stages.map(function(s, i){
    var cls = cur < 0 ? "" : (i < cur ? "done" : (i === cur ? "now" : ""));
    return '<div class="stg ' + cls + '"><div class="bar"></div>'
         + '<div class="nm" title="' + esc(s.name) + '">' + esc(s.name) + "</div></div>";
  }).join("");
  var pos = cur < 0 ? "Not started" : "Stage " + (cur + 1) + " of " + bpf.stages.length;
  return '<div class="stages">' + cells + "</div>"
       + '<div class="legend"><span><b>' + esc(bpf.name || "Business process") + "</b></span>"
       + "<span>" + esc(pos) + "</span></div>";
}

function taskItem(t){
  var done = t.state === 1;
  var due = fmtDue(t.due);
  var late = !done && due && due.late;
  var cls = done ? "done" : (late ? "late" : "now");

  var chips = "";
  if (done) chips += '<span class="chip ok">Done</span>';
  else if (late) chips += '<span class="chip late">' + esc(due.text) + "</span>";
  else if (due) chips += '<span class="chip now">' + esc(due.text) + "</span>";
  else chips += '<span class="chip now">Open</span>';
  if (!done && t.mandatory) chips += '<span class="chip warn">Required</span>';

  var meta = [];
  if (t.owner) meta.push(esc(t.owner));
  if (t.stageName) meta.push(esc(t.stageName));
  if (due) meta.push(esc(due.stamp));

  var out = "";
  if (done && t.outcome) out = '<div class="outc">' + esc(t.outcome) + "</div>";
  else if (!done && t.outcomeCount) {
    out = '<div class="meta"><a class="open" href="#" data-task="' + esc(t.id) + '">Record outcome ('
        + t.outcomeCount + " options) &rsaquo;</a></div>";
  }

  return '<div class="ti ' + cls + '"><div class="dot"></div>'
       + '<div class="nm">' + esc(t.subject || "(untitled task)") + "</div>"
       + '<div class="meta">' + chips + meta.join('<span class="sep">|</span>') + "</div>"
       + out + "</div>";
}

function paint(v){
  var c = v.case || {};
  if (!c.templateId){
    root.innerHTML = '<div class="hd"><h3>Case process</h3></div>'
      + '<div class="empty">No case process has been applied to this case yet.<br>'
      + "A process is applied automatically when the case matches a published blueprint.</div>";
    return;
  }

  var open = 0, total = (v.tasks || []).length;
  (v.tasks || []).forEach(function(t){ if (t.state !== 1) open++; });
  var pct = total ? Math.round((total - open) / total * 100) : 0;

  // Counted live rather than read from the case rollups, which settle asynchronously.
  var need = (v.documents || []).filter(function(d){ return d.mandatory; });
  var got = need.filter(function(d){ return d.received; }).length;

  var html = '<div class="hd"><h3>' + esc(c.templateName) + "</h3>"
           + '<span class="pill">' + pct + "% done</span></div>"
           + '<div class="sub">' + (total - open) + " of " + total + " task"
           + (total === 1 ? "" : "s") + " complete"
           + (need.length ? " &middot; " + got + " of " + need.length + " required documents in"
                          : "") + "</div>";

  html += stageRail(v.bpf);

  if (!total){
    html += '<div class="empty">No process tasks have been generated yet.</div>';
  } else {
    var items = (v.tasks || []).slice().sort(function(a, b){
      if ((a.state === 1) !== (b.state === 1)) return a.state === 1 ? -1 : 1;
      return (a.sequence || 0) - (b.sequence || 0);
    });
    html += '<div class="tl">' + items.map(taskItem).join("") + "</div>";
  }

  root.innerHTML = html;
  Array.prototype.forEach.call(root.querySelectorAll("a[data-task]"), function(a){
    a.onclick = function(e){
      e.preventDefault();
      openTask(a.getAttribute("data-task"));
    };
  });
}

function openTask(id){
  var x = xrm();
  if (x && x.Navigation && x.Navigation.openForm){
    x.Navigation.openForm({ entityName: "task", entityId: id });
    return;
  }
  window.open(clientUrl() + "/main.aspx?etn=task&pagetype=entityrecord&id=" + id, "_blank");
}

function load(){
  var id = caseId();
  if (!id){ root.innerHTML = '<div class="empty">Save the case to see its process.</div>'; return; }
  fetch(apiRoot() + P + "GetCaseView", {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json; charset=utf-8",
      Accept: "application/json", "OData-Version": "4.0", "OData-MaxVersion": "4.0"
    },
    body: JSON.stringify({ CaseId: id })
  })
  .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(d){ paint(JSON.parse(d.View)); })
  .catch(function(e){ root.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; });
}

load();
window.addEventListener("focus", load);
</script>
</body>
</html>
